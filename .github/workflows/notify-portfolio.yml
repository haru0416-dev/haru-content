name: Notify portfolio

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger portfolio rebuild
        env:
          DISPATCH_TOKEN: ${{ secrets.PORTFOLIO_DISPATCH_TOKEN }}
        run: |
          if [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning::PORTFOLIO_DISPATCH_TOKEN is not set. Portfolio will not be rebuilt."
            exit 0
          fi
          curl --fail -sS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/haru0416-dev/haru0416/dispatches \
            -d '{"event_type":"content-update","client_payload":{"source":"haru-content","sha":"${{ github.sha }}"}}'
          echo "Dispatched content-update to haru0416-dev/haru0416"
